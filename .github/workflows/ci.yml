name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:

  validate:
    name: validate
    runs-on: ubuntu-latest
    container:
      image: python:3.12.7-slim
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Версии Python и коммит
        run: |
          set -euo pipefail
          python --version
          echo "image    : python:3.12.7-slim"
          echo "commit   : ${{ github.sha }}"
          git log -1 --pretty='author   : %an%nsubject  : %s'
      - name: Компиляция всех .py
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(find . -path ./.git -prune -o -name '*.py'