name: CI

on:
  push:
    branches: ["main", "hotfix/*"]
    tags: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:

  validate:
    name: validate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/hotfix/')
    container:
      image: python:3.12.7-slim
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Версии Python и коммит
        run: |
          python --version
          echo "image    : python:3.12.7-slim"
          echo "commit   : ${{ github.sha }}"
          git log -1 --pretty='author   : %an%nsubject  : %s'
      - name: Компиляция всех .py
        run: |
          find . -path ./.git -prune -o -name '*.py' -print | grep -v '.git' | xargs python -m py_compile
          echo "OK: все .py скомпилированы"
      - name: Отклонить ведущие табы в .py (вариант 3)
        run: python ci/check_tabs.py

  unit_tests:
    name: unit_tests
    needs: validate
    runs-on: ubuntu-latest
    if: >-
      needs.validate.result == 'success' &&
      (github.event_name == 'pull_request' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/hotfix/'))
    container:
      image: python:3.12.7-slim
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Unit-тесты
        run: python -m unittest discover -s tests -v

  package:
    name: package
    needs: unit_tests
    runs-on: ubuntu-latest
    if: >-
      (needs.unit_tests.result == 'success' || needs.unit_tests.result == 'skipped') &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/') ||
       startsWith(github.ref, 'refs/heads/hotfix/'))
    container:
      image: python:3.12.7-slim
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Формирование артефакта и manifest.txt
        run: |
          mkdir -p dist
          cp tickets.py README.md Dockerfile tickets.csv.example dist/
          echo "CI_COMMIT_SHA: $GITHUB_SHA" > dist/manifest.txt
          echo "CI_PIPELINE_ID: $GITHUB_RUN_ID" >> dist/manifest.txt
          echo "FILES:" >> dist/manifest.txt
          ls -1 dist/ >> dist/manifest.txt
          cat dist/manifest.txt
      - name: Публикация артефакта на 7 дней
        uses: actions/upload-artifact@v4
        with:
          name: package-artifact-variant-3
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy_test:
    name: deploy_test (manual)
    needs: package
    runs-on: ubuntu-latest
    if: >-
      needs.package.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/hotfix/'))
    container:
      image: python:3.12.7-slim
    environment:
      name: test
      url: http://localhost:8103/test/tickets
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      APP_PORT: "8103"
      ENV_NAME: test
      ENV_URL: http://localhost:8103/test/tickets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка DEPLOY_TOKEN (без вывода значения)
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN не задан"
            exit 1
          fi
          echo "DEPLOY_TOKEN задан (значение скрыто, длина: ${#DEPLOY_TOKEN})"
          echo "APP_PORT=$APP_PORT"

      - name: Скачать артефакт
        uses: actions/download-artifact@v4
        with:
          name: package-artifact-variant-3
          path: artifact

      - name: Развернуть в deploy/test (рабочая область runner)
        run: |
          mkdir -p deploy/test
          cp -r artifact/. deploy/test/
          echo "=== deploy/test ==="
          ls -la deploy/test
          cat deploy/test/manifest.txt

      - name: Дымовая проверка (создание и чтение тестовой заявки)
        run: |
          python ci/smoke_test.py deploy/test
          echo "=== deployment.txt ==="
          cat deployment.txt

      - name: Сохранить отчёт deployment.txt
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deployment.txt
          retention-days: 7
          if-no-files-found: error